services:
  ai-gateway:
    # Published by .github/workflows/docker-build.yml. Override this with a
    # pinned tag or digest for a fully reproducible deployment.
    image: ${AI_GATEWAY_IMAGE:-ghcr.io/borhandarabi/ai-gateway:latest}
    container_name: ai-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    ports:
      - "${PROXY_PORT:-80}:${PROXY_PORT:-80}"
      - "${ZENFREEAPI_PORT:-3008}:${ZENFREEAPI_PORT:-3008}"
      - "${MIMO_PORT:-3003}:${MIMO_PORT:-3003}"
      - "${ZAI_PORT:-3002}:${ZAI_PORT:-3002}"
      - "${DEEPSEEK_PORT:-3005}:${DEEPSEEK_PORT:-3005}"
      - "${GROK2API_PORT:-3004}:${GROK2API_PORT:-3004}"
      - "${CLASH_API_PORT:-9090}:${CLASH_API_PORT:-9090}"
      - "${MIXED_PORT:-7890}:${MIXED_PORT:-7890}"
    # One volume preserves the gateway manager state as well as every
    # service-specific directory created by s6-rc.d/*/run:
    # /data/zenfreeapi, /data/mimo, /data/zai, /data/grok2api,
    # and /data/sing-box.
    volumes:
      - ai_gateway_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.50}
    container_name: omniroute
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET:?set a fixed value in .env}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET:?set a fixed value in .env}
      - REQUIRE_API_KEY=${OMNIROUTE_REQUIRE_API_KEY:-true}
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qwenproxy:
    image: ${QWENPROXY_IMAGE:-qwenproxy:local}
    container_name: qwenproxy
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - PORT=7936
      - PROXY_API_KEY=${QWENPROXY_API_KEY:-}
      - HTTP_PROXY=http://ai-gateway:${QWENPROXY_PROXY_PORT:-2006}
      - HTTPS_PROXY=http://ai-gateway:${QWENPROXY_PROXY_PORT:-2006}
      - ALL_PROXY=http://ai-gateway:${QWENPROXY_PROXY_PORT:-2006}
    ports:
      - "${QWENPROXY_PORT:-7936}:7936"
    volumes:
      - qwenproxy_data:/app/data

  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-rorqualx/flaresolverr-go:latest}
    container_name: flaresolverr
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - PORT=8191
      - PROXY_URL=http://ai-gateway:${FLARESOLVERR_PROXY_PORT:-8190}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML:-false}
      - HEADLESS=${FLARESOLVERR_HEADLESS:-true}
      - BROWSER_POOL_SIZE=${FLARESOLVERR_BROWSER_POOL_SIZE:-1}
      - BROWSER_POOL_TIMEOUT=${FLARESOLVERR_BROWSER_POOL_TIMEOUT:-30s}
      - MAX_MEMORY_MB=${FLARESOLVERR_MAX_MEMORY_MB:-1024}
      - SESSION_TTL=${FLARESOLVERR_SESSION_TTL:-30m}
      - SESSION_CLEANUP_INTERVAL=${FLARESOLVERR_SESSION_CLEANUP_INTERVAL:-1m}
      - MAX_SESSIONS=${FLARESOLVERR_MAX_SESSIONS:-100}
      - DEFAULT_TIMEOUT=${FLARESOLVERR_DEFAULT_TIMEOUT:-60s}
      - MAX_TIMEOUT=${FLARESOLVERR_MAX_TIMEOUT:-300s}
      - RATE_LIMIT_ENABLED=${FLARESOLVERR_RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_RPM=${FLARESOLVERR_RATE_LIMIT_RPM:-60}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"

volumes:
  ai_gateway_data:
  omniroute_data:
  qwenproxy_data:
