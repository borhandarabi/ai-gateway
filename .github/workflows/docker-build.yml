name: Build & Push ai-gateway image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - s6-rc.d/**
      - mihomo/**
      - healthcheck.sh

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OMNIROUTE_REPO: https://github.com/diegosouzapw/OmniRoute.git#release/v3.8.50
  MIMO_REPO: https://github.com/hooshidev3/mimo-ai-proxy.git#main
  METACUBEXD_REPO: https://github.com/MetaCubeX/metacubexd.git#main
  GLM_REPO: https://github.com/borhandarabi/GLM-Free-API.git#main
  MIHOMO_VERSION: v1.19.27

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (this repo -- Dockerfile / s6-rc.d / mihomo config only)
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MIHOMO_VERSION=${{ env.MIHOMO_VERSION }}
          # Named build contexts -- each stage pulls straight from the real
          # upstream repo (or its release asset, for mihomo/cloudflared) at
          # build time, so nothing here is a locally vendored copy.
          build-contexts: |
            omniroute_src=${{ env.OMNIROUTE_REPO }}
            mimo_src=${{ env.MIMO_REPO }}
            metacubexd_src=${{ env.METACUBEXD_REPO }}
            glm_src=${{ env.GLM_REPO }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
