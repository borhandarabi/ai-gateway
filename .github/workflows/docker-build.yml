name: Build & Push ai-gateway image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'تگ دلخواه ایمیج (اختیاری -- خالی بگذارید تا مثل قبل sha/latest ساخته شود)'
        required: false
        type: string
  push:
    branches: [main]
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MIMO_REPO: https://github.com/hooshidev3/mimo-ai-proxy.git#main
  GROK2API_REPO: https://github.com/chenyme/grok2api.git#main
  ZAI_REPO: https://github.com/borhandarabi/GLM-Free-API.git#main
  KIMI_REPO: https://github.com/izaart95-jpg/KimiFreeAPI.git#main
  DEEPSEEK_REPO: https://github.com/izaart95-jpg/DeepSeekFreeAPI.git#main
  FLARESOLVERR_REPO: https://github.com/Rorqualx/flaresolverr-go.git#main
  QWEN2API_REPO: https://github.com/XxxXTeam/Qwen2API_Go.git#main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted arm64 runners avoid QEMU emulation entirely, which
          # is both faster and removes the emulation-overhead side of the
          # memory pressure. If your plan/org doesn't have these available,
          # switch runs-on back to ubuntu-latest and set qemu: true instead --
          # it'll still work, just slower and more memory-sensitive.
          #
          - platform: linux/amd64
            runs-on: ubuntu-latest
            qemu: false
            variant: default
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            qemu: false
            variant: default
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (this repo -- Dockerfile / s6-rc.d / singbox-manager)
        uses: actions/checkout@v4

      - name: Set up QEMU (only if this platform needs emulation)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push (by digest, this platform only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-contexts: |
            mimo_src=${{ env.MIMO_REPO }}
            grok2api_src=${{ env.GROK2API_REPO }}
            zai_src=${{ env.ZAI_REPO }}
            kimi_src=${{ env.KIMI_REPO }}
            deepseek_src=${{ env.DEEPSEEK_REPO }}
            qwen2api_src=${{ env.QWEN2API_REPO }}
            flaresolverr_src=${{ env.FLARESOLVERR_REPO }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.variant }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merges the amd64 + arm64 digests built above into one multi-arch manifest
  # list under the real tags (sha + latest, or the custom tag) -- run once per
  # variant (default), each producing its own manifest list. This
  # step needs no build resources itself, just registry API calls.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.variant }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine custom tag (git tag push, or workflow_dispatch input)
        id: tagcalc
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (real tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # railway variant gets the same tag(s) as default, with -railway
          # appended (to the custom tag, the sha tag, and to "latest" too).
          flavor: |
            suffix=${{ matrix.variant == 'railway' && '-railway' || '' }},onlatest=true
          tags: |
            type=raw,value=${{ steps.tagcalc.outputs.tag }},enable=${{ steps.tagcalc.outputs.tag != '' }}
            type=sha,format=long,enable=${{ steps.tagcalc.outputs.tag == '' }}
            type=raw,value=latest,enable=${{ steps.tagcalc.outputs.tag == '' && github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect final image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
