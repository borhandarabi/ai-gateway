name: Build & Push ai-gateway image

on:
  workflow_dispatch:
    inputs:
      glm_repo:
        description: "zai-api (GlmApi) git URL, e.g. https://github.com/org/zai-api.git#main -- leave blank until it's pushed"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - Dockerfile
      - s6-rc.d/**
      - mihomo/**
      - healthcheck.sh

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MIMO_REPO: https://github.com/hooshidev3/mimo-ai-proxy.git#main
  METACUBEXD_REPO: https://github.com/MetaCubeX/metacubexd.git#main
  GROK2API_REPO: https://github.com/i-panel/grok2api-go.git#main
  GLM_REPO: https://github.com/borhandarabi/GLM-Free-API.git#main
  MIHOMO_VERSION: v1.19.27
  # OmniRoute is pulled as a prebuilt base image (see Dockerfile), not built
  # from source. Pin to a specific tag instead of the floating latest-web
  # once you've settled on a version, for reproducible builds.
  OMNIROUTE_IMAGE: diegosouzapw/omniroute:latest-web

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            qemu: false
          # GitHub-hosted arm64 runners avoid QEMU emulation entirely, which
          # is both faster and removes the emulation-overhead side of the
          # memory pressure. If your plan/org doesn't have these available,
          # switch runs-on back to ubuntu-latest and set qemu: true instead --
          # it'll still work, just slower and more memory-sensitive.
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            qemu: false
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (this repo -- Dockerfile / s6-rc.d / mihomo config only)
        uses: actions/checkout@v4

      # OmniRoute no longer builds from source at all (see Dockerfile -- it's
      # now a prebuilt base image), which removes the actual cause of the
      # repeated "cannot allocate memory" failures. Keeping this swap step
      # anyway as cheap insurance for the remaining Go/Node builds (grok2api,
      # metacubexd, etc.) on constrained runners.
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up QEMU (only if this platform needs emulation)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push (by digest, this platform only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            MIHOMO_VERSION=${{ env.MIHOMO_VERSION }}
            OMNIROUTE_IMAGE=${{ env.OMNIROUTE_IMAGE }}
          build-contexts: |
            mimo_src=${{ env.MIMO_REPO }}
            metacubexd_src=${{ env.METACUBEXD_REPO }}
            grok2api_src=${{ env.GROK2API_REPO }}
            glm_src=${{ env.GLM_REPO }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merges the amd64 + arm64 digests built above into one multi-arch manifest
  # list under the real tags (sha + latest) -- this step needs no build
  # resources itself, just registry API calls.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (real tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${{ steps.meta.outputs.json }}") \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect final image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
