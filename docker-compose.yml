services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        mimo_src: ${MIMO_REPO:-https://github.com/hooshidev3/mimo-ai-proxy.git#main}
        grok2api_src: ${GROK2API_REPO:-https://github.com/borhandarabi/GLM-Free-API.git#main}
        zai_src: ${ZAI_REPO:-https://github.com/izaart95-jpg/GLM-Free-API.git#main}
        kimi_src: ${KIMI_REPO:-https://github.com/izaart95-jpg/KimiFreeAPI.git#main}
        deepseek_src: ${DEEPSEEK_REPO:-https://github.com/izaart95-jpg/DeepSeekFreeAPI.git#main}
      args:
        MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.27}
        OMNIROUTE_IMAGE: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.49-web}
    image: ai-gateway:local
    container_name: ai-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    ports:
      - "${PROXY_PORT:-80}:${PROXY_PORT:-80}" # General Reverse Proxy
      - "${OMNIROUTE_PORT:-20128}:${OMNIROUTE_PORT:-20128}"   # OmniRoute
      - "${MIMO_PORT:-3001}:${MIMO_PORT:-3001}"     # MimoApi
      - "${ZAI_PORT:-3002}:${ZAI_PORT:-3002}"     # zai-api / GlmApi
      - "${DEEPSEEK_PORT:-3005}:${DEEPSEEK_PORT:-3005}"     # DeepSeekApi
      - "${GROK2API_PORT:-3004}:${GROK2API_PORT:-3004}"
      - "${QWEN2API_PORT:-3006}:${QWEN2API_PORT:-3006}"
      - "${CLASH_API_PORT:-9090}:${CLASH_API_PORT:-9090}"
      - "${MIXED_PORT:-7890}:${MIXED_PORT:-7890}"
      - "${FLARESOLVERR_PORT:-8191}:${FLARESOLVERR_PORT:-8191}"     # mihomo mixed-port (SOCKS/HTTP)
    volumes:
      - omniroute_data:/data/omniroute
      - mimo_data:/data/mimo
      - zai_data:/data/zai
      - grok2api_data:/data/grok2api
      - mihomo_data:/data/mihomo
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  omniroute_data:
  mimo_data:
  zai_data:
  grok2api_data:
  qwen2api_data:
  singbox_data:
  mihomo_data:
  flaresolverr_config:
