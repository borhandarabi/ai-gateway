services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        mimo_src: ${MIMO_REPO:-https://github.com/hooshidev3/mimo-ai-proxy.git#main}
        grok2api_src: ${GROK2API_REPO:-https://github.com/chenyme/grok2api.git#main}
        zai_src: ${ZAI_REPO:-https://github.com/izaart95-jpg/GLM-Free-API.git#main}
        kimi_src: ${KIMI_REPO:-https://github.com/izaart95-jpg/KimiFreeAPI.git#main}
        deepseek_src: ${DEEPSEEK_REPO:-https://github.com/izaart95-jpg/DeepSeekFreeAPI.git#main}
      args:
        MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.27}
        OMNIROUTE_IMAGE: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.49-web}
    image: ai-gateway:local
    container_name: ai-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    ports:
      - "20128:20128"   # OmniRoute
      - "3001:3001"     # MimoApi
      - "3002:3002"     # zai-api / GlmApi
      - "3005:3005"     # DeepSeekApi
      - "8000:8000"     # grok2api-go
      - "9090:9090"     # mihomo Clash API
      - "7890:7890"     # mihomo mixed-port (SOCKS/HTTP)
    volumes:
      - omniroute_data:/data/omniroute
      - mimo_data:/data/mimo
      - zai_data:/data/zai
      - grok2api_data:/data/grok2api
      - mihomo_data:/data/mihomo
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  omniroute_data:
  mimo_data:
  zai_data:
  grok2api_data:
  mihomo_data:
  flaresolverr_config:
