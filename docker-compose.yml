services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        mimo_src: ${MIMO_REPO:-https://github.com/hooshidev3/mimo-ai-proxy.git#main}
        grok2api_src: ${GROK2API_REPO:-https://github.com/izaart95-jpg/GLM-Free-API.git#main}
        zai_src: ${ZAI_REPO:-https://github.com/izaart95-jpg/GLM-Free-API.git#main}
        kimi_src: ${KIMI_REPO:-https://github.com/izaart95-jpg/KimiFreeAPI.git#main}
        deepseek_src: ${DEEPSEEK_REPO:-https://github.com/indicatorspro/DeepSeekFreeAPI.git#main}
        zenfreeapi_src: ${ZENFREEAPI_REPO:-https://github.com/izaart95-jpg/ZenFreeAPI.git#main}
    image: ai-gateway:local
    container_name: ai-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    ports:
      - "${PROXY_PORT:-80}:${PROXY_PORT:-80}" # General Reverse Proxy
      - "${ZENFREEAPI_PORT:-3008}:${ZENFREEAPI_PORT:-3008}"   # ZenFreeAPI
      - "${MIMO_PORT:-3001}:${MIMO_PORT:-3001}"     # MimoApi
      - "${ZAI_PORT:-3002}:${ZAI_PORT:-3002}"     # zai-api / GlmApi
      - "${DEEPSEEK_PORT:-3005}:${DEEPSEEK_PORT:-3005}"     # DeepSeekApi
      - "${GROK2API_PORT:-3004}:${GROK2API_PORT:-3004}"
      - "${CLASH_API_PORT:-9090}:${CLASH_API_PORT:-9090}"
      - "${MIXED_PORT:-7890}:${MIXED_PORT:-7890}"
    volumes:
      - zenfreeapi_data:/data/zenfreeapi
      - mimo_data:/data/mimo
      - zai_data:/data/zai
      - grok2api_data:/data/grok2api
      - singbox_data:/data/sing-box
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OmniRoute runs in its OWN image/container, deliberately separate from
  # ai-gateway -- resource limits (CPU/memory) in Docker apply per-container,
  # and OmniRoute's dashboard + provider traffic must not compete with
  # ai-gateway's own services (several of which launch Chromium) for the
  # same memory budget. It is NOT built from source here; it uses the
  # official published image directly. Six ai-gateway services (mimo, zai,
  # kimi, deepseek, grok2api, qwenproxy) are reachable from this container at
  # http://ai-gateway:<port>/v1 (or direct container name for external services)
  # on the shared compose network -- add each one
  # manually from the OmniRoute dashboard (Providers -> Add Provider ->
  # Custom Provider); see README.md "OmniRoute" section for exact base URLs,
  # keys, and which of the OpenAI-compatible / Anthropic-compatible add-paths
  # fits each service.
  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.50}
    container_name: omniroute
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET:?set a fixed value in .env -- must stay stable across restarts/redeploys or sessions and API keys break}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET:?set a fixed value in .env -- must stay stable across restarts/redeploys or sessions and API keys break}
      - REQUIRE_API_KEY=${OMNIROUTE_REQUIRE_API_KEY:-true}
      - OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS=${OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS:-true}
      - OMNIROUTE_ALLOW_LOCAL_PROVIDER_URLS=${OMNIROUTE_ALLOW_LOCAL_PROVIDER_URLS:-true}
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  # qwenproxy runs in its own container (https://github.com/johngbl/qwenproxy.git)
  # separate from ai-gateway because of Playwright/Chromium requirements.
  # Outbound requests can proxy through ai-gateway's sing-box proxy port (2006),
  # and ai-gateway reverse-proxies /qwenproxy to http://qwenproxy:7936.
  qwenproxy:
    build:
      context: ${QWENPROXY_REPO:-https://github.com/johngbl/qwenproxy.git#main}
    image: qwenproxy:local
    container_name: qwenproxy
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - PORT=7936
      - PROXY_API_KEY=${QWENPROXY_API_KEY:-}
      - HTTP_PROXY=http://ai-gateway:${QWENPROXY_PROXY_PORT:-2006}
      - HTTPS_PROXY=http://ai-gateway:${QWENPROXY_PROXY_PORT:-2006}
      - ALL_PROXY=http://ai-gateway:${QWENPROXY_PROXY_PORT:-2006}
    ports:
      - "${QWENPROXY_PORT:-7936}:7936"
    volumes:
      - qwenproxy_data:/app/data

  # FlareSolverr runs as an external service container (rorqualx/flaresolverr-go:latest).
  # It routes its outbound requests through ai-gateway's sing-box proxy port (8190),
  # and ai-gateway reverse-proxies /flaresolverr to http://flaresolverr:8191.
  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-rorqualx/flaresolverr-go:latest}
    container_name: flaresolverr
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - PORT=8191
      - PROXY_URL=http://ai-gateway:${FLARESOLVERR_PROXY_PORT:-8190}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML:-false}
      - HEADLESS=${FLARESOLVERR_HEADLESS:-true}
      - BROWSER_POOL_SIZE=${FLARESOLVERR_BROWSER_POOL_SIZE:-1}
      - BROWSER_POOL_TIMEOUT=${FLARESOLVERR_BROWSER_POOL_TIMEOUT:-30s}
      - MAX_MEMORY_MB=${FLARESOLVERR_MAX_MEMORY_MB:-1024}
      - SESSION_TTL=${FLARESOLVERR_SESSION_TTL:-30m}
      - SESSION_CLEANUP_INTERVAL=${FLARESOLVERR_SESSION_CLEANUP_INTERVAL:-1m}
      - MAX_SESSIONS=${FLARESOLVERR_MAX_SESSIONS:-100}
      - DEFAULT_TIMEOUT=${FLARESOLVERR_DEFAULT_TIMEOUT:-60s}
      - MAX_TIMEOUT=${FLARESOLVERR_MAX_TIMEOUT:-300s}
      - RATE_LIMIT_ENABLED=${FLARESOLVERR_RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_RPM=${FLARESOLVERR_RATE_LIMIT_RPM:-60}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"

volumes:
  zenfreeapi_data:
  mimo_data:
  zai_data:
  grok2api_data:
  singbox_data:
  omniroute_data:
  qwenproxy_data:
