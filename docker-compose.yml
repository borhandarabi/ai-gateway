services:
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        mimo_src: ${MIMO_REPO:-https://github.com/hooshidev3/mimo-ai-proxy.git#main}
        grok2api_src: ${GROK2API_REPO:-https://github.com/izaart95-jpg/GLM-Free-API.git#main}
        zai_src: ${ZAI_REPO:-https://github.com/izaart95-jpg/GLM-Free-API.git#main}
        kimi_src: ${KIMI_REPO:-https://github.com/izaart95-jpg/KimiFreeAPI.git#main}
        deepseek_src: ${DEEPSEEK_REPO:-https://github.com/izaart95-jpg/DeepSeekFreeAPI.git#main}
        qwen2api_src: ${QWEN2API_REPO:-https://github.com/XxxXTeam/Qwen2API_Go.git#main}
        zenfreeapi_src: ${ZENFREEAPI_REPO:-https://github.com/izaart95-jpg/ZenFreeAPI.git#main}
        flaresolverr_src: "${FLARESOLVERR_REPO:-https://github.com/Rorqualx/flaresolverr-go.git#main}"
    image: ai-gateway:local
    container_name: ai-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    ports:
      - "${PROXY_PORT:-80}:${PROXY_PORT:-80}" # General Reverse Proxy
      - "${ZENFREEAPI_PORT:-3008}:${ZENFREEAPI_PORT:-3008}"   # ZenFreeAPI
      - "${MIMO_PORT:-3001}:${MIMO_PORT:-3001}"     # MimoApi
      - "${ZAI_PORT:-3002}:${ZAI_PORT:-3002}"     # zai-api / GlmApi
      - "${DEEPSEEK_PORT:-3005}:${DEEPSEEK_PORT:-3005}"     # DeepSeekApi
      - "${GROK2API_PORT:-3004}:${GROK2API_PORT:-3004}"
      - "${QWEN2API_PORT:-3006}:${QWEN2API_PORT:-3006}"
      - "${CLASH_API_PORT:-9090}:${CLASH_API_PORT:-9090}"
      - "${MIXED_PORT:-7890}:${MIXED_PORT:-7890}"
      - "${FLARESOLVERR_PORT:-8191}:${FLARESOLVERR_PORT:-8191}"     # FlareSolverr HTTP port
    volumes:
      - zenfreeapi_data:/data/zenfreeapi
      - mimo_data:/data/mimo
      - zai_data:/data/zai
      - grok2api_data:/data/grok2api
      - singbox_data:/data/sing-box
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OmniRoute runs in its OWN image/container, deliberately separate from
  # ai-gateway -- resource limits (CPU/memory) in Docker apply per-container,
  # and OmniRoute's dashboard + provider traffic must not compete with
  # ai-gateway's own services (several of which launch Chromium) for the
  # same memory budget. It is NOT built from source here; it uses the
  # official published image directly. Six ai-gateway services (mimo, zai,
  # kimi, deepseek, grok2api, qwen2api) are reachable from this container at
  # http://ai-gateway:<port>/v1 on the shared compose network -- add each one
  # manually from the OmniRoute dashboard (Providers -> Add Provider ->
  # Custom Provider); see README.md "OmniRoute" section for exact base URLs,
  # keys, and which of the OpenAI-compatible / Anthropic-compatible add-paths
  # fits each service.
  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.50}
    container_name: omniroute
    restart: unless-stopped
    depends_on:
      - ai-gateway
    env_file:
      - .env
    environment:
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET:?set a fixed value in .env -- must stay stable across restarts/redeploys or sessions and API keys break}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET:?set a fixed value in .env -- must stay stable across restarts/redeploys or sessions and API keys break}
      - REQUIRE_API_KEY=${OMNIROUTE_REQUIRE_API_KEY:-true}
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  zenfreeapi_data:
  mimo_data:
  zai_data:
  grok2api_data:
  qwen2api_data:
  singbox_data:
  singbox_data:
  flaresolverr_config:
  omniroute_data:
