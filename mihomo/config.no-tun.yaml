# Same as ../mihomo/config.yaml but with TUN disabled -- used automatically
# when DISABLE_TUN=true (see s6-rc.d/mihomo/run). Needed on platforms that
# don't grant CAP_NET_ADMIN / /dev/net/tun to containers (e.g. Railway).
# Only SOCKS/HTTP mixed-port mode is available in this mode -- TUN-dependent
# transparent/system-wide routing does not apply; anything that needs the
# proxy must be explicitly pointed at 127.0.0.1:7890 (HTTP_PROXY/HTTPS_PROXY
# or an app-level proxy setting).

mixed-port: 7890
external-controller: 0.0.0.0:9090
secret: ""            # TODO: set a real secret for the control API in production

tun:
  enable: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  nameserver:
    - 1.1.1.1
    - 8.8.8.8

proxies: []
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT

rules:
  - PROCESS-NAME,cloudflared,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,::1/128,DIRECT
  - MATCH,PROXY
